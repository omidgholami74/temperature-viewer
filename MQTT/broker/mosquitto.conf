# Mosquitto configuration for the furnace MQTT stack (development).
#
# This file is deliberately permissive: it exists so a laptop can run
# docker compose up and have a working broker in seconds. Production settings
# (passwords, ACLs, TLS) are in README.md and docs/operations.md.
#
# Mosquitto 2.x requires explicit listeners; without them it only listens on
# loopback.

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true

# --- plain MQTT for devices and the bridge ---------------------------------
listener 1883
protocol mqtt
allow_anonymous true

# --- MQTT over WebSocket for the browser dashboard -------------------------
# The official image is built with libwebsockets, so this works out of the box.
listener 9001
protocol websockets
allow_anonymous true
