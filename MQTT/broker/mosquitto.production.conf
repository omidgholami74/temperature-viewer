# Mosquitto configuration for the furnace MQTT stack — production.
#
# development defaults (anonymous, no persistence limits) live in
# `mosquitto.conf`; this file is the one `MQTT/setup-server.sh` installs as
# /etc/mosquitto/conf.d/furnace-mqtt.conf.
#
# Debian/Ubuntu/Raspberry Pi OS ship a mosquitto.conf that ends with
#   include_dir /etc/mosquitto/conf.d
# so dropping this file in is enough. Mosquitto 2.x otherwise listens only on
# loopback, which is why the listener is declared here.

per_listener_settings true

# Batches survive a broker restart; the bridge is at-least-once, so a replay is
# deduplicated by the device sequence number on the other side.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# 600 frames of four channels is about 30 KiB; 256 KiB is a safe ceiling
# (MQTT/docs/operations.md, "Security").
message_size_limit 262144

# --- plain MQTT for devices and the local bridge ---------------------------
# Keep this on the internal network. It is not a TLS port and must not be
# port-forwarded: see the 8883 listener below for anything that leaves the LAN.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# --- TLS for devices outside the LAN (optional) ----------------------------
# Generate a private CA and a server certificate first
# (MQTT/docs/operations.md, "Security"), then uncomment. per_listener_settings
# means every listener carries its own auth settings.
#
#listener 8883 0.0.0.0
#protocol mqtt
#allow_anonymous false
#password_file /etc/mosquitto/passwd
#acl_file /etc/mosquitto/acl
#cafile   /etc/mosquitto/certs/ca.crt
#certfile /etc/mosquitto/certs/server.crt
#keyfile  /etc/mosquitto/certs/server.key
#tls_version tlsv1.2

# --- MQTT over WebSocket for MQTT/dashboard (optional) ---------------------
# Only needed when the static MQTT dashboard is used instead of `ui/`. Put it
# behind TLS (9002) before exposing it: the dashboard password travels in the
# CONNECT packet.
#
#listener 9001
#protocol websockets
#allow_anonymous false
#password_file /etc/mosquitto/passwd
#acl_file /etc/mosquitto/acl
