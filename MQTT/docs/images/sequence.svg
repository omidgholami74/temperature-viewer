<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Sequence: device publishes a batch, broker forwards it, bridge stores it through the API and returns an acknowledgement; the dashboard receives the batch from the broker.">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38e0a5"/>
    </marker>
    <marker id="a3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6d8198"/>
    </marker>
    <style>
      .t3 { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      .m3 { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .h3 { fill: #eaf2fb; font-size: 13px; font-weight: 600; }
      .s3 { fill: #6d8198; font-size: 11px; }
      .l3 { fill: #a6b8cb; font-size: 11px; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#070d14"/>
  <text x="36" y="42" class="t3" fill="#eaf2fb" font-size="20" font-weight="600">Sequence — publish, store, acknowledge</text>
  <text x="36" y="62" class="t3 s3">Numbers are the order of operations; the device never sees a stored batch it cannot retry.</text>

  <!-- lifelines -->
  <g>
    <rect x="36" y="88" width="140" height="42" rx="9" fill="#101b28" stroke="#26394e"/>
    <text x="106" y="114" class="t3 h3" text-anchor="middle">Device</text>
    <path d="M106 130V488" stroke="#22364a" stroke-dasharray="4 4"/>

    <rect x="230" y="88" width="140" height="42" rx="9" fill="#101b28" stroke="#26394e"/>
    <text x="300" y="114" class="t3 h3" text-anchor="middle">Broker</text>
    <path d="M300 130V488" stroke="#22364a" stroke-dasharray="4 4"/>

    <rect x="424" y="88" width="140" height="42" rx="9" fill="#101b28" stroke="#26394e"/>
    <text x="494" y="114" class="t3 h3" text-anchor="middle">Bridge</text>
    <path d="M494 130V488" stroke="#22364a" stroke-dasharray="4 4"/>

    <rect x="618" y="88" width="140" height="42" rx="9" fill="#101b28" stroke="#26394e"/>
    <text x="688" y="114" class="t3 h3" text-anchor="middle">PHP API</text>
    <path d="M688 130V488" stroke="#22364a" stroke-dasharray="4 4"/>

    <rect x="808" y="88" width="118" height="42" rx="9" fill="#101b28" stroke="#26394e"/>
    <text x="867" y="114" class="t3 h3" text-anchor="middle">Dashboard</text>
    <path d="M867 130V488" stroke="#22364a" stroke-dasharray="4 4"/>
  </g>

  <!-- messages -->
  <g stroke="#38e0a5" stroke-width="1.5" marker-end="url(#a3)">
    <path d="M106 168H292"/>
    <path d="M300 208H486"/>
    <path d="M494 288H680"/>
  </g>
  <text x="118" y="160" class="t3 m3" fill="#38e0a5" font-size="10">1 · PUBLISH samples · QoS 1</text>
  <text x="312" y="200" class="t3 m3" fill="#38e0a5" font-size="10">2 · DELIVER to bridge subscription</text>
  <text x="506" y="280" class="t3 m3" fill="#49bdf0" font-size="10">3 · POST /api/ingest</text>

  <!-- dashboard branch -->
  <g stroke="#6d8198" stroke-width="1.4" marker-end="url(#a3g)" stroke-dasharray="4 3">
    <path d="M300 236H859"/>
    <path d="M688 320H498"/>
  </g>
  <text x="500" y="228" class="t3 m3" fill="#6d8198" font-size="10">2b · same batch to the dashboard</text>
  <text x="520" y="312" class="t3 m3" fill="#6d8198" font-size="10">3b · 200 accepted</text>

  <!-- ack -->
  <path d="M494 368H114" stroke="#6d8198" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a3g)"/>
  <text x="134" y="360" class="t3 m3" fill="#6d8198" font-size="10">5 · ack {seq, ok:true, accepted}</text>

  <!-- store note -->
  <rect x="576" y="338" width="220" height="58" rx="8" fill="#0e1a26" stroke="#26394e"/>
  <text x="590" y="358" class="t3 l3">4 · transaction + run bounds</text>
  <text x="590" y="376" class="t3 s3">readings, sample_count, active_ms</text>

  <!-- failure band -->
  <rect x="36" y="406" width="888" height="76" rx="10" fill="#0b141e" stroke="#2b3f55"/>
  <text x="52" y="428" class="t3 l3" font-weight="600">If step 3 fails</text>
  <text x="52" y="448" class="t3 s3">5xx / timeout → the batch goes back to the head of the queue, retried with backoff; the device keeps the frames because no ack was sent.</text>
  <text x="52" y="466" class="t3 s3">422 → dropped and acked ok:false (the payload can never succeed); 401/403 → kept, because a rotated key is fixable.</text>

  <text x="36" y="504" class="t3 s3">Duplicates are expected at QoS 1: a repeated seq is acknowledged without a second write.</text>
</svg>
