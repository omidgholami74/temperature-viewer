# Furnace broker — drop-in for /etc/mosquitto/conf.d/furnace.conf
#
# Debian/Ubuntu/Raspberry Pi OS ship a mosquitto.conf that ends with
#   include_dir /etc/mosquitto/conf.d
# so this file is picked up without editing the stock config:
#
#   sudo cp infrastructure/mqtt/furnace.conf /etc/mosquitto/conf.d/furnace.conf
#   sudo systemctl restart mosquitto
#
# Mosquitto 2.x defaults to a localhost-only listener when no listener is
# declared. Declaring one explicitly is what lets the boards on the LAN connect.

per_listener_settings true

listener 1883 0.0.0.0

# No anonymous clients: every board has its own username and password.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/aclfile

# The bridge runs on this host, so plain MQTT never leaves the machine's
# network. Do not port-forward 1883 on the router.
persistence false
max_keepalive 180

connection_messages true
log_type error
log_type warning
log_type notice
log_dest file /var/log/mosquitto/mosquitto.log

# --- TLS listener (use this when the broker is not on the same LAN) ---------
# Create the certificates first (see docs/mqtt-setup.md §4b), then uncomment.
# per_listener_settings means every listener needs its own auth settings.
#
#listener 8883 0.0.0.0
#allow_anonymous false
#password_file /etc/mosquitto/passwd
#acl_file /etc/mosquitto/aclfile
#cafile   /etc/mosquitto/certs/ca.crt
#certfile /etc/mosquitto/certs/server.crt
#keyfile  /etc/mosquitto/certs/server.key
#require_certificate false
#tls_version tlsv1.2
